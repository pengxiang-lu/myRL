[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "g1-mujoco-ppo"
version = "0.1.0"
description = "Unitree G1 locomotion with PPO and MuJoCo"
requires-python = ">=3.12,<3.13"
dependencies = ["torch==2.8.0", "numpy>=1.24,<3", "mujoco>=3.2,<4", "gymnasium>=1.0,<2", "stable-baselines3>=2.4,<3", "tensorboard>=2.15", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8.4"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://mirrors.nju.edu.cn/pytorch/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://mirrors.nju.edu.cn/pytorch/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pypi-mirror"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[project.scripts]
g1-train = "g1_rl.train:main"
g1-evaluate = "g1_rl.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--disable-plugin-autoload"
testpaths = ["tests"]
pythonpath = ["src"]
